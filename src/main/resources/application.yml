spring:
  application:
    name: spring-boot-template
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/template_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /api

# MyBatis configuration
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.template.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-fetch-size: 100

# JSON implementation choice: jackson | fastjson2
json:
  implementation: jackson

# Apollo config
app:
  id: spring-boot-template
  apollo:
    bootstrap:
      enabled: true
      namespaces: application,common
    meta: http://localhost:8080
    cluster: default

# Retrofit clients (configured via Apollo at runtime, but can be overridden locally)
clients:
  demo-client:
    host: http://localhost:9090
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    write-timeout-ms: 5000

logging:
  level:
    com.example.template: debug
    com.squareup.okhttp3: info